# Contract fragment for the Family Points & Reward Levels feature (demo scope).
#
# This is NOT a standalone OpenAPI document — it is a staging area for the
# paths, schemas, and enum changes that must be merged into docs/openapi.yaml
# during Phase A, step 1 of plan.md, before codegen is run. Do not point
# tooling at this file directly.
#
# Conventions match the existing docs/openapi.yaml: BearerAuth security
# (inherited globally), shared $ref components for common responses/params,
# operationId per route, tags for grouping.

tags_to_add:
  - name: Verification
    description: Group-admin photo verification queue
  - name: Rewards
    description: Family-level point balance and reward-level redemption

# ─────────────────────────────────────────────────────────────
# CompletionStatus enum change (existing schema — modify in place)
# ─────────────────────────────────────────────────────────────
#
# Find the existing CompletionStatus enum (or inline enum on Completion /
# CompletionHistoryItem status field) and change:
#   [processing, ready, self_reported]
# to:
#   [processing, pending_verification, verified, rejected, self_reported]
#
# Also add to the completion upload request body and to Completion /
# CompletionHistoryItem schemas:
#   duration_minutes:
#     type: integer
#     nullable: true
#     description: >
#       Minutes the family reports spending on the activity. Required when
#       the completed activity's resolved tier is casual (server-enforced);
#       optional otherwise.
#   rejection_reason:
#     type: string
#     nullable: true
#     description: Set when status is rejected; null otherwise.

paths:

  # ── Completions (modify existing file) ─────────────────────

  /completions/{completionId}/photo:
    patch:
      operationId: reuploadCompletionPhoto
      tags: [Completions]
      summary: Replace the photo on an existing completion
      description: >
        On a verified completion, updates only photo_key (status/points
        unchanged). On a rejected completion, re-triggers the compression
        pipeline and resets status to pending_verification. Not permitted
        on self_reported completions.
      parameters:
        - $ref: "#/components/parameters/CompletionId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [photo]
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        "202":
          description: Photo accepted, pipeline re-triggered (or updated in place if verified)
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion_id:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/CompletionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Verification (new, group-scoped) ───────────────────────

  /groups/{groupId}/verification-queue:
    get:
      operationId: getVerificationQueue
      tags: [Verification]
      summary: List pending-verification completions for the group (group admin only)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated verification queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerificationQueue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /groups/{groupId}/verification-queue/{completionId}/approve:
    post:
      operationId: approveCompletionPhoto
      tags: [Verification]
      summary: Approve a pending completion photo (group admin only)
      description: Sets status=verified, awards points to the family's ledger, creates an audit record.
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/CompletionId"
      responses:
        "200":
          description: Approved
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion_id:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/CompletionStatus"
                  points_awarded:
                    type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /groups/{groupId}/verification-queue/{completionId}/reject:
    post:
      operationId: rejectCompletionPhoto
      tags: [Verification]
      summary: Reject a pending completion photo with a reason (group admin only)
      parameters:
        - $ref: "#/components/parameters/GroupId"
        - $ref: "#/components/parameters/CompletionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectPayload"
      responses:
        "200":
          description: Rejected
          content:
            application/json:
              schema:
                type: object
                properties:
                  completion_id:
                    type: string
                    format: uuid
                  status:
                    $ref: "#/components/schemas/CompletionStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  # ── Rewards (new, family-scoped — not group-scoped) ────────

  /rewards/balance:
    get:
      operationId: getRewardsBalance
      tags: [Rewards]
      summary: Get the current family's quarter balance and 4-level progress
      description: >
        Family-scoped, not group-scoped — resolved from the current user's
        family. Returns the current-quarter point balance (derived from the
        ledger, not stored) and, for each of the 4 seeded reward levels,
        whether it is locked, unlocked, or already redeemed this quarter.
      responses:
        "200":
          description: Balance and level progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RewardsBalance"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /rewards/levels/{levelId}/redeem:
    post:
      operationId: redeemRewardLevel
      tags: [Rewards]
      summary: Redeem an unlocked reward level for the current family
      description: >
        Milestone redemption — does not debit the point balance. Fails if
        the level is locked, already redeemed this quarter, or (Level 4
        only) already redeemed 3 times this calendar year. Level 3 requires
        chosen_option.
      parameters:
        - name: levelId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedeemPayload"
      responses:
        "201":
          description: Redeemed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RedemptionResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

components:
  parameters:
    CompletionId:
      name: completionId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  schemas:
    PendingVerificationItem:
      type: object
      properties:
        completion_id:
          type: string
          format: uuid
        family_name:
          type: string
          description: Family display name only — no child names or child-identifiable data.
        activity_title:
          type: string
        photo_url:
          type: string
          format: uri
        duration_minutes:
          type: integer
          nullable: true
        submitted_at:
          type: string
          format: date-time

    VerificationQueue:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PendingVerificationItem"
        total:
          type: integer

    RejectPayload:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1

    RewardLevel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        level_number:
          type: integer
        points_threshold:
          type: integer
        title:
          type: string
        title_en:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        description_en:
          type: string
          nullable: true
        choice_options:
          type: array
          items:
            type: string
          nullable: true
        annual_redemption_cap:
          type: integer
          nullable: true

    RewardLevelProgress:
      allOf:
        - $ref: "#/components/schemas/RewardLevel"
        - type: object
          properties:
            state:
              type: string
              enum: [locked, unlocked, redeemed_this_quarter]
            redemptions_this_year:
              type: integer
              description: Only meaningful for the capped level (Level 4).

    RewardsBalance:
      type: object
      properties:
        quarter_key:
          type: string
          example: "2026-Q3"
        balance:
          type: integer
        levels:
          type: array
          items:
            $ref: "#/components/schemas/RewardLevelProgress"

    RedeemPayload:
      type: object
      properties:
        chosen_option:
          type: string
          nullable: true
          description: Required when the level has choice_options (Level 3).

    RedemptionResult:
      type: object
      properties:
        redemption_id:
          type: string
          format: uuid
        reward_level_id:
          type: string
          format: uuid
        chosen_option:
          type: string
          nullable: true
        voucher_code:
          type: string
          example: "BOND-7K2P9Q"
        redeemed_at:
          type: string
          format: date-time
