# Time Spent Insights — API contract fragment
#
# Merge this fragment into docs/openapi.yaml before implementation, then run
# the repository's datamodel-codegen command. This is a planning artifact, not
# a second authoritative specification.

tags_to_add:
  - name: Time Spent
    description: Private time-spent tracking for the authenticated parent

paths:

  /time-spent:
    get:
      operationId: getTimeSpentInsight
      tags: [Time Spent]
      summary: Get the authenticated parent's weekly or monthly time-spent insight
      description: >
        Combines activity durations attributed to the authenticated parent with
        that parent's manual daily time. No user or family identifier is accepted.
      parameters:
        - name: period
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/TimeSpentPeriod"
        - name: anchor_date
          in: query
          required: true
          description: >
            Parent's local calendar date anchoring the requested week or month.
            The active client never sends a future local date.
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Personal time-spent series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeSpentInsight"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /time-spent/manual:
    put:
      operationId: upsertManualTime
      tags: [Time Spent]
      summary: Set or replace the authenticated parent's manual time for a local date
      description: >
        Upserts one value per authenticated parent and entry_date. The product UI
        sends only its local current date; repeated saves replace the prior value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertManualTimeRequest"
      responses:
        "200":
          description: Manual value created or replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ManualTimeEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"

components:
  responses:

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:

    TimeSpentPeriod:
      type: string
      enum: [weekly, monthly]

    UpsertManualTimeRequest:
      type: object
      required: [entry_date, minutes]
      additionalProperties: false
      properties:
        entry_date:
          type: string
          format: date
          description: Parent's local calendar date; active UI sends local today
        minutes:
          type: integer
          minimum: 1
          maximum: 1440

    ManualTimeEntry:
      type: object
      required: [id, entry_date, minutes, created_at, updated_at]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        entry_date:
          type: string
          format: date
        minutes:
          type: integer
          minimum: 1
          maximum: 1440
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DailyTimeTotal:
      type: object
      required: [date, activity_minutes, manual_minutes, total_minutes]
      additionalProperties: false
      properties:
        date:
          type: string
          format: date
        activity_minutes:
          type: integer
          minimum: 0
        manual_minutes:
          type: integer
          minimum: 0
        total_minutes:
          type: integer
          minimum: 0

    WeeklyTimeTotal:
      type: object
      required: [start_date, end_date, total_minutes]
      additionalProperties: false
      properties:
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        total_minutes:
          type: integer
          minimum: 0

    TimeSpentInsight:
      type: object
      required:
        - period
        - range_start
        - range_end
        - daily_totals
        - weekly_totals
        - average_weekly_minutes
      additionalProperties: false
      properties:
        period:
          $ref: "#/components/schemas/TimeSpentPeriod"
        range_start:
          type: string
          format: date
        range_end:
          type: string
          format: date
        daily_totals:
          type: array
          items:
            $ref: "#/components/schemas/DailyTimeTotal"
        weekly_totals:
          type: array
          description: Empty for weekly view; clipped Monday-based buckets for monthly view
          items:
            $ref: "#/components/schemas/WeeklyTimeTotal"
        average_weekly_minutes:
          anyOf:
            - type: integer
              minimum: 0
            - type: "null"
          description: Null for weekly view; rounded average of monthly weekly_totals

# Existing schema changes to merge into docs/openapi.yaml
existing_schema_changes:

  CreateCompletionRequest:
    required_additions: [duration_minutes, completed_on]
    properties_to_add:
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 1440
        description: Required time spent for a self-reported completion
      completed_on:
        type: string
        format: date
        description: Parent's local calendar date when the activity was completed

  PhotoUploadRequest:
    required_additions: [completed_on]
    properties_to_modify_or_add:
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 1440
        nullable: true
        description: >
          Reported activity time. Required for casual activities by the existing
          points rule; optional otherwise.
      completed_on:
        type: string
        format: date
        description: Parent's local calendar date when the activity was completed

  Completion:
    required_additions: [completed_on]
    properties_to_modify_or_add:
      duration_minutes:
        type: integer
        minimum: 1
        maximum: 1440
        nullable: true
      completed_on:
        type: string
        format: date

  CompletionHistoryItem:
    required_additions: [completed_on]
    properties_to_add:
      completed_on:
        type: string
        format: date

# Existing paths remain in place. In particular, /journal/entries and all
# Journal schemas are intentionally unchanged even though no active client view
# displays them.
