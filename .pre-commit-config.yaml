# Runs the GitHub Actions CI jobs locally, in Docker, before each commit, so a
# commit can't pass locally yet fail in CI. Client checks use node:20 and server
# checks use python:3.12 to match the CI runners exactly (a node/npm version
# mismatch is what previously let a package-lock drift reach CI undetected).
#
# Hooks are path-gated: a commit only runs the job(s) for the area it touches.
# Setup (once per clone):  pre-commit install
# Emergency bypass:        git commit --no-verify   (CI will still enforce these)
repos:
  - repo: local
    hooks:
      - id: client-ci
        name: client CI (node:20 · npm ci · tsc · expo lint)
        entry: scripts/precommit-client-ci.sh
        language: script
        files: ^client/
        exclude: ^client/(\.expo|node_modules)/
        pass_filenames: false

      - id: server-ci
        name: server CI (python:3.12 · ruff · mypy · pytest)
        entry: scripts/precommit-server-ci.sh
        language: script
        files: ^server/
        pass_filenames: false
